# Projecte GI3P - DAM1_Grup2
# Entorn de desenvolupament amb Docker

services:
  # 1. Servidor web amb PHP i Apache
  web:
    build:
      context: ./php/images
      dockerfile: Dockerfile_php
    ports:
      - "8080:80"
    volumes:
      - ./php:/var/www/html
    environment:
      # Variables per a la connexió a la base de dades
      DB_HOST: db
      DB_USER: a25abualijab_grup2
      DB_PASSWORD: "@ErikerAbubakar2"
      DB_NAME: a25abualijab_DAM1_GI3P_Grup2
    depends_on:
      - db

  # 2. Base de dades MySQL
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: a25abualijab_DAM1_GI3P_Grup2
      MYSQL_USER: a25abualijab_grup2
      MYSQL_PASSWORD: "@ErikerAbubakar2"
      LANG: C.UTF-8
    volumes:
      - ./db_data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"

  # 3. Adminer - Client web per gestionar MySQL
  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

  # 4. MongoDB
  mongo:
    image: mongo:latest
    volumes:
      #Named volume, no cal posar res al .gitignore
      #perque no es crea una carpeta al host sinó que es crea un volum a docker
      # i es pot veure amb docker volume ls
      # i es pot eliminar amb docker volume rm nom_del_volum      
      - mongodb_data:/data/db
    ports:
      - "27017:27017"

  # 5. mongo-express - Client web per gestionar MongoDB
  mongo-express:
    image: mongo-express
    ports:
      - "8082:8081"
    environment:
      #Per entrar a la web de mongo-express, no calen credencials
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
    depends_on:
      - mongo

# Volums
#Les dades del mongodb les guardem en un named volume
#perque així no es perden quan es recrea el contenidor
#Però el podem esborrar des del terminal amb:
#docker volume ls #per veure els volums creats
#docker volume rm nom_del_volum #per eliminar un volum
volumes:
  mongodb_data: